<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080A12"/>
      <stop offset="100%" stop-color="#12081A"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" fill="url(#bg)"/>
  <rect width="960" height="300" fill="url(#sweep)"/>
  <rect y="0" width="960" height="3" fill="#8B5CF6"/>
  <rect y="297" width="960" height="3" fill="#22D3EE"/>
  <text x="480" y="78" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#F8FAFC">VONTARIUS FALLS</text>
  <text x="480" y="112" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#C4B5FD">AI · WEB3 · MARKETS · AGENTS</text>
  <!-- cards -->
  <g font-family="DejaVu Sans, sans-serif">
    <g>
      <rect x="48" y="150" width="200" height="90" rx="14" fill="#121020" stroke="#8B5CF6" stroke-width="2">
        <animate attributeName="y" values="150;146;150" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="148" y="178" text-anchor="middle" font-size="12" fill="#A78BFA" font-weight="700">PUBLIC REPOS</text>
      <text x="148" y="218" text-anchor="middle" font-size="32" fill="#F8FAFC" font-weight="700">13</text>
    </g>
    <g>
      <rect x="268" y="150" width="200" height="90" rx="14" fill="#121020" stroke="#8B5CF6" stroke-width="2">
        <animate attributeName="y" values="150;146;150" dur="2.4s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <text x="368" y="178" text-anchor="middle" font-size="12" fill="#A78BFA" font-weight="700">PRIVATE REPOS</text>
      <text x="368" y="218" text-anchor="middle" font-size="32" fill="#F8FAFC" font-weight="700">48</text>
    </g>
    <g>
      <rect x="488" y="150" width="200" height="90" rx="14" fill="#121020" stroke="#8B5CF6" stroke-width="2">
        <animate attributeName="y" values="150;146;150" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <text x="588" y="178" text-anchor="middle" font-size="12" fill="#A78BFA" font-weight="700">FOLLOWERS</text>
      <text x="588" y="218" text-anchor="middle" font-size="32" fill="#F8FAFC" font-weight="700">2</text>
    </g>
    <g>
      <rect x="708" y="150" width="200" height="90" rx="14" fill="#121020" stroke="#8B5CF6" stroke-width="2">
        <animate attributeName="y" values="150;146;150" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="808" y="178" text-anchor="middle" font-size="12" fill="#A78BFA" font-weight="700">JOINED</text>
      <text x="808" y="218" text-anchor="middle" font-size="32" fill="#F8FAFC" font-weight="700">2025</text>
    </g>
