name: Live stats
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIVE_STATS_TOKEN: ${{ secrets.LIVE_STATS_TOKEN }}
        run: python scripts/update_live_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh live GitHub activity"
            git push
          fi
